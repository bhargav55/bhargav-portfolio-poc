name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write runtime config
        env:
          PORTFOLIO_RAG_API_URL: ${{ vars.PORTFOLIO_RAG_API_URL }}
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync('config.js', 'window.PORTFOLIO_RAG_API_URL = ' + JSON.stringify(process.env.PORTFOLIO_RAG_API_URL || '') + ';\\n');"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
